name: Gravity Sketch
description: 'Gravity Sketch is a 3D design and modeling application built for spatial creation, letting
  designers sketch, model, and iterate on concepts in virtual reality (Meta Quest, PC VR) and on tablet.
  It is widely used across automotive, footwear, industrial, and product design for early-stage ideation
  and collaborative review, backed by a cloud collaboration platform (LandingPad) for sharing and version
  history. The company is a creative-tools maker rather than an API-first provider; as of this enrichment
  pass it publishes no public developer API, OpenAPI, developer portal, or documented webhook surface. This
  profile was surfaced as a portfolio company of Accel, GV, and Point Nine and captures the company identity
  plus a live domain-security probe.'
